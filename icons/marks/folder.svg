<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Folder: the thing a sidebar row stands for when the entry holds other
       entries. It names a thing rather than a control, which is what tells it
       from the open-folder mark: that one is drawn on the control that
       chooses which folder a window is showing.

       MEASURED at 1x, the folder symbol on every folder row of
       voicememos-multi-folder-2026-09-18.png (the panel at x 64-283, the
       first folder row's box y 203-234). Sub-pixel edges are the coverage
       summed along a cut: across y=220 the leading band runs 83.00-84.50 and
       the trailing 101.50-103.00, and down x=92 the body's top band runs
       212.61-214.09, the flap 215.33-216.70 and the foot 225.51-227.00. So
       the body is 20.00 px across by 14.39 down, the tab rises 1.61 above it
       to y=211.00, every band measures 1.37 to 1.50, the tab runs 6.7 px of
       the body's 20, and the flap stands 1.24 px clear of the body's inner
       top face.

       THIS MARK'S OWN BAND IS THE EXCEPTION THE SET RECORDS: its capture
       reads 1.37 to 1.50 where the set draws one measured 1.4 everywhere, so
       the reading brackets the set's band rather than agreeing with it to a
       figure. The set draws one band and this file states what its own
       capture gives.

       Grid: an axis-aligned form, so it fills the set's square keyline across
       — 2.5 to 21.5, 19 units — and takes the set's one band of 1.4. The
       body's 14.39 by 20.00 proportion puts it 13.67 units deep against 19
       across; 13.5 is the nearest depth the figure can take with its two
       bands where the capture puts them, drawn from 6 to 19.5. The tab is the
       measured 1.61 px proud, drawn at 1.5 units — an extent the capture
       gives and not a band — which takes the whole figure to 15 units, from
       4.5 to 19.5, centred on both axes. The tab runs to 9: the measured
       6.7 px of the body's 20 is 6.37 units and 9 is the unit nearest the end
       of that. The flap's leading edge stands at 8.6: the measured 1.24 px of
       air over a mean band of 1.42 is 0.87 of a band, which against the set's
       1.4 is 1.22 units below the body's inner top face at 7.4, and 8.6 puts
       the flap's trailing edge on the whole unit 10.

       Where each band lands. A band of 1.4 units holds a whole device pixel
       when its own span contains one: at 24 dp that wants a leading edge on a
       whole unit or no more than 0.4 below one, at 20 dp a leading edge whose
       five sixths does the same against 1.167 px, and at 16 dp nothing at all
       — 1.4 units is 0.93 px there, under one device pixel. So the body's TOP
       at 6 lands a whole pixel at 20 and 24 dp and reaches 0.933 at 16; the
       FLAP at 8.6 lands one at 24 dp and reaches 0.833 at 20 and 0.667 at 16.
       The tab's top at 4.5 and the body's FOOT at 18.1 land none, reaching
       0.900 at 24 dp, 0.917 at 20 and 0.933 at 16. The two SIDES land none
       either — the keyline's 19 units is odd against a 24-unit box, so they
       stand at 2.5 and 20.1 — and reach 0.900 at 24 dp, 0.917 at 20 and 0.600
       at 16. Moving the sides onto a whole unit costs the figure the keyline,
       which is the measured extent the whole set is drawn to, so the keyline
       stands and the miss is recorded.

       THE FLAP IS INSET, and that is what tells this mark from the
       open-folder one at a glance. The capture holds it clear of the body's
       two sides by about 1.2 px of a 20 px body, which is 1.14 units against
       this figure's 19; it is drawn at 1.25 in from each side of the inner
       pane, so it runs 5.15 to 18.85 where the open-folder mark's flap runs
       the full inner width its own capture reads it at. Mail's pull-down and
       Voice Memos' sidebar draw two folders and this is the difference
       between them; without it the two marks are one drawing with a row
       between them.

       Three contours, abutting rather than winding against each other: the
       tab's bar, the body as an outline with its inner edge wound back, and
       the flap. -->
  <path fill="#000000" d="M2.5 4.5 L9 4.5 L9 6 L2.5 6 Z"/>
  <path fill="#000000" d="M2.5 6 L21.5 6 L21.5 19.5 L2.5 19.5 Z M3.9 7.4 L3.9 18.1 L20.1 18.1 L20.1 7.4 Z"/>
  <path fill="#000000" d="M5.15 8.6 L18.85 8.6 L18.85 10 L5.15 10 Z"/>
</svg>
