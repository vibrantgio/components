<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Disclosure: the mark on the control that opens and closes a row's
       children. It is drawn pointing at the row it would open — the control
       turns it a quarter turn when the row is open, so there is one drawing
       here and not two.

       Grid: a diagonal form, so it takes the 20-unit allowance rather than the
       square keyline — a chevron inside an 18 box reads smaller than a square
       does. The band's centre line runs from 7.5,3 to 16.5,12 to 7.5,21: two
       arms at 45 degrees and every corner of the centre line on the 1.5
       sub-grid. The band takes the diagonal measure, 2 units, which is what a
       45-degree edge needs to cover device pixels whole at the sizes the
       library draws. With the caps and the turn added the drawing is 11 by 20,
       filling the allowance exactly — which is what settles the measure at 2
       rather than at more. Nothing here is axis-aligned, so the caps and the
       turn are drawn as geometry — the outline is one closed contour, which is
       what gives a stroked figure ends and a corner the backend would
       otherwise cut square.

       Where the band-landing rule reaches. It does not: both arms run at 45
       degrees and no edge of this drawing runs along the grid, so neither
       has a leading edge at 1.5m to land a whole device pixel inside. What
       the rule asks for is had the other way — the diagonal measure of 2
       units is 1.33 px at 16 dp, 1.67 at 20 and 2.00 at 24, and a band at 45
       degrees that wide covers better than 99.7% of the pixel it runs
       through at all three. The centre line's own corners stand on the 1.5
       sub-grid, which is where a diagonal figure can be held to the grid at
       all. -->
  <path fill="#000000" d="M8.207 2.293 L17.207 11.293 C17.598 11.683 17.598 12.317 17.207 12.707 L8.207 21.707 C7.817 22.098 7.183 22.098 6.793 21.707 C6.402 21.317 6.402 20.683 6.793 20.293 L15.086 12 L6.793 3.707 C6.402 3.317 6.402 2.683 6.793 2.293 C7.183 1.902 7.817 1.902 8.207 2.293 Z"/>
</svg>
