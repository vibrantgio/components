<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Square and arrow up: a box open at the top with an arrow rising out of
       it. The mark is the picture and never what a control does with it: the
       platform stands this symbol on the control that hands the open document
       to somewhere else, and what is handed over is that control's title to
       say.

       MEASURED at 1x off finder-window-light.png, Finder's share control in
       the toolbar (the symbol over x 838-852, y 16-35). The control is
       switched off in that window, so the figure plateaus at 191 rather than
       at the toolbar's own value and every reading below is the coverage that
       plateau gives. Sub-pixel edges are the coverage summed across a band:

         the box        the leading side's outer edge at x 838.000 on a band
                        of 1.39 and the trailing side's outer edge at 852.610
                        on one of 1.41, so THE BOX IS 14.61 PX ACROSS; its top
                        edge's outer face at y 21.810 on a band of 1.39 and
                        its foot's outer face at 35.000 on one of 1.39, so THE
                        BOX IS 13.19 PX DOWN
         the shaft      its leading edge at x 844.640 on a band of 1.33,
                        centred on 845.305, which is the box's own centre to
                        the thousandth; its foot at y 28.392
         the air        the leading stub ends at x 843.170 and the trailing
                        one starts at 847.420, which leaves 1.47 px of air on
                        the leading side of the shaft and 1.45 on the trailing
                        one
         the head       a chevron pointing up, its apex at y 16.348 fitted
                        from the ink standing above each row, its arms running
                        1.107 px across per px down, its tips 8.09 px apart
                        and its ends about y 20.0, which puts 1.31 px of air
                        between them and the box's top edge

       THE WHOLE FIGURE IS 18.69 PX DOWN, from the apex to the box's foot,
       against 14.61 across: the long direction is DOWN, so the figure fills
       the set's square keyline there — 2.5 to 21.5, 19 units — and takes its
       own fitted extent across it. One drawn unit is 1.0166 px down and
       0.9993 across.

       Grid. The box is drawn 14.6 units across, the fitted reading to the
       hundredth, from 4.7 to 19.3 — centred on the grid's own 12, which is
       where the capture centres it on the shaft. Its foot stands on the
       keyline at 20.1 and its top edge at 8, the whole unit beside the fitted
       8.09. The shaft is 1.4 across centred on 12, from 11.3 to 12.7, and
       runs down to 14.8, the fitted 28.392 carried onto this grid. The head
       is drawn 8 units across, tip to tip, which is the fitted 8.09 and the
       set's own chevron width.

       THE AIR IS DRAWN AT 2.1 UNITS, one and a half bands, and it is drawn
       wider than the capture reads it. The renderer opens air only between a
       band and a figure knocked out of a solid one; the air here stands
       between two bands of one mark — the box's top edge against the shaft,
       and the head's arm ends against that same top edge — and both bands are
       widened outward by half the widening, so the air closes by the whole of
       it. At 2.1 units it comes to 2.10 px at 24 dp, 1.52 at 20 and 1.02 at
       16 once both have grown, which holds the set's floor of one device
       pixel at every size the library draws a mark at. The capture gives 1.47
       and 1.45 px across the shaft and 1.31 down to the head, which would
       close to 0.55 px at 16 dp — a gap the rasterizer can only report as
       part coverage of the band beside it, where the two figures read as one.
       That is what the drawn air costs: the opening is 5.6 units wide against
       the capture's 4.9, and the head is 3.4 units deep against the fitted
       3.65, its arms running 1.176 units across per unit down against the
       fitted 1.107.

       The head is the set's chevron: an apex mitred at the band, arms at one
       weight and the two ends cut square, as chevron-pair.svg draws them. Its
       apex stands on the keyline at 2.5 and its ends at 5.9, which is the
       2.1 of air above the box's top edge at 8. The shaft's top is drawn at 4,
       inside the solid apex, so the two are one figure; the inner faces reach
       the shaft's sides at 4.93 and the notches open below that.

       Where each band lands. The set's band is a DEVICE width — 1.32 px below
       20 dp and 1.40 from 20 up — and half its widening is spent outward on
       either edge, so what decides a landing is where its leading edge falls:
       no more than 0.40 px below a pixel boundary at 24 dp, 0.40 at 20 and
       0.32 at 16. The two SIDES at 4.7 and 17.9 land a whole device pixel at
       all three sizes, which is what the fitted 14.6 bought when it was
       centred: 4.7 and 17.9 stand 0.3 and 0.1 below a whole unit, and both
       stay under the next boundary at every size. The box's TOP at 8 lands
       one at 24 dp and reaches 0.950 at 20 and 0.860 at 16. Its FOOT at 20.1
       stands on the keyline, which the keyline's 19 odd units keeps off every
       whole unit: it lands one at 20 dp alone, reaching 0.900 at 24 and 0.793
       at 16. The SHAFT at 11.3 lands one at none of the three AND REACHES
       0.700, 0.700 and 0.660 — it is centred on the figure, and a band of 1.4
       centred on unit 12 falls 0.3 past the whole unit below it whatever the
       scale. Moving it to 10.6, where the plus's own bars stand, would land
       it at all three and take it 0.7 leading of the centre line the capture
       puts it on, which the plus can afford because its arms hide the move
       and this figure cannot: the box's two stubs stand either side of the
       shaft and would come out 3.8 and 5.2 units long. So the centre line
       stands and the miss is recorded. ON A 2x WINDOW IT LANDS AT EVERY
       SIZE — a mark 24 dp wide is 48 px there, and the shaft spans 22.6 to
       25.4 px with two whole ones inside it — so what the reading above
       states is the figure at 1x. The head's arms run on neither axis and the
       rule reaches none of them.

       Two paths. The box is one contour: a band open at the top is simply
       connected, so its outer and inner faces are walked as one loop that
       turns down each cut end. The head and the shaft are two contours of one
       path wound the same way, so the overlap at the apex fills solid under
       the non-zero winding rule rather than cutting a hole in it.

       THE FOUR SQUARE CORNERS ARE ROUNDED AT 2.4 UNITS, the round the set
       draws every square form at, with the inner faces concentric at 1.0. The
       two cut ends carry no round: they are ends of a band and not corners,
       the same rule the plus's four arms and the document's cut are drawn
       by. -->
  <path fill="#000000" d="M14.8 8 L16.9 8 C18.2255 8 19.3 9.0745 19.3 10.4 L19.3 19.1 C19.3 20.4255 18.2255 21.5 16.9 21.5 L7.1 21.5 C5.7745 21.5 4.7 20.4255 4.7 19.1 L4.7 10.4 C4.7 9.0745 5.7745 8 7.1 8 L9.2 8 L9.2 9.4 L7.1 9.4 C6.5477 9.4 6.1 9.8477 6.1 10.4 L6.1 19.1 C6.1 19.6523 6.5477 20.1 7.1 20.1 L16.9 20.1 C17.4523 20.1 17.9 19.6523 17.9 19.1 L17.9 10.4 C17.9 9.8477 17.4523 9.4 16.9 9.4 L14.8 9.4 Z"/>
  <path fill="#000000" d="M8 5.9 L12 2.5 L16 5.9 L13.8382 5.9 L12 4.3375 L10.1618 5.9 Z M11.3 4 L12.7 4 L12.7 14.8 L11.3 14.8 Z"/>
</svg>
