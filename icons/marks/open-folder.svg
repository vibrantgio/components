<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Open folder: the control that opens a folder — chooses which one the
       window is showing. One picture whichever folder is meant; which one is
       the control's label to say.

       MEASURED at 1x, mail-window.png's folder pull-down (the control at
       x 706-757): the folder's covered box is 19 by 15 px in a control 36 px
       tall — x 716-734, y 19-33 — its band 1.34 px, a run across the leading
       edge at y=27 reading 233 then 113 on a fill of 36, which over a
       foreground of 233 is 1.00 + 0.34 of a pixel. The tab stands one pixel
       proud of the body over the leading seven columns (x 716-722 at y=19
       against the body's top edge at y=20), and the flap line runs the full
       width two pixels clear of that top edge (y 23-24 against y=20).

       Grid: an axis-aligned form, so it fills the set's square keyline across
       — 2.5 to 21.5, 19 units, which is the capture's own 19 px to the pixel
       — and takes the set's axis-aligned band of 1.5, a sixth over
       the measured 1.34. The platform's 15 by 19 proportion puts the drawing
       15 units deep against 19 across, from 4.5 to 19.5, which centres the
       figure on both axes. The tab is one band proud rather than the
       capture's single pixel, which is the shallowest rise this set can draw,
       and it runs to 9.5 — the capture's seven columns of its nineteen, drawn
       as seven units of the keyline's nineteen.

       THE FLAP stands 2.25 units below the body's inner top face, at 9.75.
       That is the capture's own relation read as a ratio and not as a count
       of bands: a 1.34 px top edge, 2.00 px of air, then the flap, so the air
       is 1.49 times the band and against the set's 1.5 it is 2.24 units. The
       body's inner top face is at 7.5 and the flap runs 9.75 to 11.25.

       Where each band lands. The tab's top at 4.5 (m=3), the body's top at 6
       (m=4) and the body's foot at 18 (m=12) are on the 1.5 sub-grid and land
       a whole device pixel at 16, 20 and 24 dp alike. The FLAP at 9.75 lands
       one at 24 dp and reaches 0.500 of its best pixel at 16 and 0.875 at 20.
       The two SIDES land one at 24 dp alone — the keyline's 19 units is odd
       against a 24-unit box, so they stand at 2.5 and 20 — and reach 0.667 at
       16 dp and 0.917 at 20, where the platform's own capture has them at a
       flat 1.34 px. Moving the sides onto the sub-grid costs the figure the
       keyline, which is the measured extent the whole set is drawn to, so the
       keyline stands and the miss is recorded.

       Three contours, abutting rather than winding against each other: the
       tab's bar, the body as an outline with its inner edge wound back, and
       the flap. -->
  <path fill="#000000" d="M2.5 4.5 L9.5 4.5 L9.5 6 L2.5 6 Z"/>
  <path fill="#000000" d="M2.5 6 L21.5 6 L21.5 19.5 L2.5 19.5 Z M4 7.5 L4 18 L20 18 L20 7.5 Z"/>
  <path fill="#000000" d="M4 9.75 L20 9.75 L20 11.25 L4 11.25 Z"/>
</svg>
