<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Open folder: the control that opens a folder — chooses which one the
       window is showing. One picture whichever folder is meant; which one is
       the control's label to say.

       MEASURED at 1x, mail-window.png's folder pull-down (the control at
       x 706-757): the folder's covered box is 19 by 15 px in a control 36 px
       tall — x 716-734, y 19-33 — its band 1.34 px, a run across the leading
       edge at y=27 reading 233 then 113 on a fill of 36, which over a
       foreground of 233 is 1.00 + 0.34 of a pixel. The tab stands one pixel
       proud of the body over the leading seven columns (x 716-722 at y=19
       against the body's top edge at y=20), and the flap line runs the full
       width two pixels clear of that top edge (y 23-24 against y=20).

       Grid: an axis-aligned form, so it fills the set's square keyline across
       — 2.5 to 21.5, 19 units, which is the capture's own 19 px to the pixel
       — and takes the set's one band of 1.4, a twentieth over this capture's
       own 1.34. The platform's 15 by 19 proportion puts the drawing 15 units
       deep against 19 across, from 4.5 to 19.5, which centres the figure on
       both axes. The tab is 1.5 units proud rather than the capture's single
       pixel, which is the shallowest rise this set can draw, and it runs to
       9.5 — the capture's seven columns of its nineteen, drawn as seven units
       of the keyline's nineteen.

       THE FLAP stands 2.09 units below the body's inner top face. That is the
       capture's own relation read as a ratio and not as a count of bands: a
       1.34 px top edge, 2.00 px of air, then the flap, so the air is 1.49
       times the band and against the set's 1.4 it is 2.09 units. The body's
       inner top face is at 7.4 and the flap is drawn from 9.6, a tenth of a
       unit under that, which puts its trailing edge on the whole unit 11.

       Where each band lands. A band of 1.4 units holds a whole device pixel
       when its own span contains one: at 24 dp that wants a leading edge on a
       whole unit or no more than 0.4 below one, at 20 dp a leading edge whose
       five sixths does the same against 1.167 px, and at 16 dp nothing at all
       — 1.4 units is 0.93 px there, under one device pixel. So the body's TOP
       at 6 and the FLAP at 9.6 each land a whole pixel at 20 and 24 dp, and
       reach 0.933 and 0.600 of their best pixel at 16. The tab's top at 4.5
       and the body's FOOT at 18.1 land none, reaching 0.900 at 24 dp, 0.917
       at 20 and 0.933 at 16. The two SIDES land none either — the keyline's
       19 units is odd against a 24-unit box, so they stand at 2.5 and 20.1 —
       and reach 0.900 at 24 dp, 0.917 at 20 and 0.600 at 16, where the
       platform's own capture has them at a flat 1.34 px. Moving the sides
       onto a whole unit costs the figure the keyline, which is the measured
       extent the whole set is drawn to, so the keyline stands and the miss is
       recorded.

       Three contours, abutting rather than winding against each other: the
       tab's bar, the body as an outline with its inner edge wound back, and
       the flap. -->
  <path fill="#000000" d="M2.5 4.5 L9.5 4.5 L9.5 6 L2.5 6 Z"/>
  <path fill="#000000" d="M2.5 6 L21.5 6 L21.5 19.5 L2.5 19.5 Z M3.9 7.4 L3.9 18.1 L20.1 18.1 L20.1 7.4 Z"/>
  <path fill="#000000" d="M3.9 9.6 L20.1 9.6 L20.1 11 L3.9 11 Z"/>
</svg>
