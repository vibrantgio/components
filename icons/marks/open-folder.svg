<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Open folder: the control that opens a folder — chooses which one the
       window is showing. One picture whichever folder is meant; which one is
       the control's label to say.

       MEASURED at 1x, mail-window.png's folder pull-down (the control at
       x 706-757): the folder's covered box is 19 by 15 px in a control 36 px
       tall — x 716-734, y 19-33 — its band 1.34 px, a run across the leading
       edge at y=27 reading 233 then 113 on a fill of 36, which over a
       foreground of 233 is 1.00 + 0.34 of a pixel. The tab stands one pixel
       proud of the body over the leading seven columns (x 716-722 at y=19
       against the body's top edge at y=20), and the flap line runs the full
       width two pixels clear of that top edge (y 23-24 against y=20).

       Grid: an axis-aligned form, so it fills the set's 18-unit square
       keyline across — 3 to 21 — and takes the set's axis-aligned band of
       1.5. The platform's 15 by 19 proportion puts the drawing 14.2 units
       deep against 18 across; 15 is the nearest depth on the set's 1.5
       sub-grid, drawn from 4.5 to 19.5, which centres the figure on both
       axes. The tab is one band proud rather than the capture's single pixel,
       which is the shallowest rise this set can draw, and it runs to 10.5 —
       the 7.5 units the capture's seven columns scale to. The flap stands one
       band clear of the body's inner top edge, which is the capture's own
       relation: a 1-pixel top edge, 2 pixels of air, then the flap.

       Where each band lands. A band's leading edge at 1.5m puts a whole
       device pixel inside it at 16, 20 and 24 dp when m is 0 or 3 mod 4. The
       four horizontal bands land: the tab's top at 4.5 (m=3), the body's top
       at 6 (m=4), the flap at 10.5 (m=7) and the body's bottom at 18 (m=12).
       The two VERTICAL bands do NOT — the leading edge at 3 is m=2 and the
       trailing at 19.5 is m=13 — and that is the miss this drawing carries:
       at 20 dp neither side of the folder covers a whole column, where the
       platform's own capture has them at a flat 1.34 px. Moving them to 4.5
       and 18 would land both and take the figure to 15 units across against
       the keyline's 18 and the capture's 19, which is a worse miss on a
       reading that is measured.

       Three contours, abutting rather than winding against each other: the
       tab's bar, the body as an outline with its inner edge wound back, and
       the flap. -->
  <path fill="#000000" d="M3 4.5 L10.5 4.5 L10.5 6 L3 6 Z"/>
  <path fill="#000000" d="M3 6 L21 6 L21 19.5 L3 19.5 Z M4.5 7.5 L4.5 18 L19.5 18 L19.5 7.5 Z"/>
  <path fill="#000000" d="M4.5 10.5 L19.5 10.5 L19.5 12 L4.5 12 Z"/>
</svg>
