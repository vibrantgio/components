<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Sidebar, the drawing for macOS: the same pane and seam the fallback
       carries, with the three faint list lines that platform puts in the
       leading column. One picture for the control in every state — showing and
       hiding a sidebar is the control's business to signal, not the mark's, so
       nothing here morphs.

       Grid: the pane is 18 by 15 on the 24 grid, so its sides sit on the
       square keyline 3 units in and its top and bottom at 4.5 and 19.5 — a
       landscape rectangle in the proportion a window with a sidebar has. The
       band is the set's axis-aligned measure of 1.5 units — every edge here
       runs along the grid, so none of them takes the diagonal compensation —
       giving an inner pane of 15 by 12. Corner radius 3 outside and 1.5
       inside, which keeps the band even all the way round; a sharper corner
       reads as a screen rather than a window. Outer contour clockwise, inner
       counter-clockwise, so the band is a hole under the non-zero winding
       rule.

       MEASURED at 1x, voicememos-window.png, the sidebar toggle standing in
       that window's toolbar band (the capsule x 96-135, the symbol x 106-125,
       y 18-33, in a control 36 px tall — the 24-unit mark box, so one px there
       is one unit here). Read against the control's own fill of 39 and a
       foreground of 233:

         the pane      19.31 by 15.12 units
         the band       1.39 units, all four sides — the leading side reads
                        233 then 115, which is 1.00 + 0.39 of a pixel, and the
                        trailing side 54, 233, 100, which is 0.08 + 1.00 + 0.31
         the seam       1.33 units, standing 4.99 units in from the inner pane
                        with 10.21 after it: one to 2.05
         the corners    a radius near 3 units — column 106 arrives at 0.05,
                        0.60, 0.92 and 1.00 down the four rows below the pane's
                        top edge, which a circle of r 3 gives as 0, 0.67, 0.98
                        and 1.00 and one of r 2 as 0, 0.96, 1.00, 1.00

       The 15 and the seam are drawn as measured. The width is not: 18 is the
       nearest the grid reaches while the mark stays centred in its box, the
       centred widths either side of the reading being 18 and 21, whose
       proportions against a 15 height are 1.20 and 1.40 against the measured
       1.28. The band is drawn at the set's own 1.5, a sixth heavier than the
       1.39, which is the miss the whole set carries and the reference records.
       Both readings are recorded and the grid stands.

       Where the whole device pixel lands. At one pixel per dp the top band
       covers 3.0-4.0 at 16, 3.75-5.0 at 20 and 4.5-6.0 at 24, and the bottom
       band the same, so each takes a pixel whole at all three sizes. The two
       sides and the seam take one whole at 16 and 24 and reach 0.75 of one at
       20, where they land 2.5-3.75, 16.25-17.5 and 7.5-8.75. A band on this
       grid lands a whole pixel at all three sizes only when its leading edge
       is 1.5m with m ≡ 0 or 3 (mod 4) — 0, 4.5, 6, 10.5, 12, 16.5, 18, 22.5 —
       which is what puts the plus mark's two bars at 10.5. Moving the sides to
       those units costs the pane either its centre or four units of its width,
       and moving the seam costs it the measured one to two, so the measurement
       stands over the third size's crispness. -->
  <path fill="#000000" d="M18 4.5 C19.657 4.5 21 5.843 21 7.5 L21 16.5 C21 18.157 19.657 19.5 18 19.5 L6 19.5 C4.343 19.5 3 18.157 3 16.5 L3 7.5 C3 5.843 4.343 4.5 6 4.5 Z M6 6 C5.172 6 4.5 6.672 4.5 7.5 L4.5 16.5 C4.5 17.328 5.172 18 6 18 L18 18 C18.828 18 19.5 17.328 19.5 16.5 L19.5 7.5 C19.5 6.672 18.828 6 18 6 Z"/>
  <!-- The seam, one band wide, spanning the inner pane from top to bottom.
       It stands a third of the way across, which leaves the leading column
       half the width of the trailing one — the proportion the capture reads,
       one to 2.05, drawn here as 4.5 against 9. Its own contour, so it abuts
       the frame rather than winding against it. -->
  <path fill="#000000" d="M9 6 L10.5 6 L10.5 18 L9 18 Z"/>
  <!-- The list lines: three round-capped bars at the axis-aligned band weight,
       carried on centres 3 units apart from y 8.25, so at the smallest size
       the library draws they land one device pixel on and one off. They are
       secondary — they say "a list lives here", they are not the subject — and
       they are made secondary with fill-opacity rather than with a second
       colour, which is what lets them stay faint against whatever colour the
       control paints the mark in. They sit high in the column rather than
       centred, the way a list that has not filled its pane does.

       MEASURED off the same toggle, x 108-111, y 21-31: the three bars carry
       2.80 units of coverage between them over a length of 2.53, so each is
       0.93 units thick, and their centres stand 3.95, 6.15 and 8.35 units
       below the pane's top edge — a period of 2.20 — ending 3.78 units in from
       the inner pane. The length and the first bar are drawn as measured, at
       3.00 and 3.75. The thickness is not: 0.93 units falls to 0.62 px at the
       16 dp end of the range, well under the device pixel the set's floor
       holds its bands to, so they take the set's 1.5 and give the weight back
       through fill-opacity. That thickness sets the period too: at the
       measured 2.20 the gap between two bars would be 0.70 units, 0.47 px at
       16 dp, and three bars would read as one block. -->
  <path fill="#000000" fill-opacity="0.8" d="M6 7.5 L7.5 7.5 C7.914 7.5 8.25 7.836 8.25 8.25 C8.25 8.664 7.914 9 7.5 9 L6 9 C5.586 9 5.25 8.664 5.25 8.25 C5.25 7.836 5.586 7.5 6 7.5 Z M6 10.5 L7.5 10.5 C7.914 10.5 8.25 10.836 8.25 11.25 C8.25 11.664 7.914 12 7.5 12 L6 12 C5.586 12 5.25 11.664 5.25 11.25 C5.25 10.836 5.586 10.5 6 10.5 Z M6 13.5 L7.5 13.5 C7.914 13.5 8.25 13.836 8.25 14.25 C8.25 14.664 7.914 15 7.5 15 L6 15 C5.586 15 5.25 14.664 5.25 14.25 C5.25 13.836 5.586 13.5 6 13.5 Z"/>
</svg>
