<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Sidebar, the drawing for macOS: the same pane and seam the fallback
       carries, with the three list lines that platform puts in the leading
       column. One picture for the control in every state — showing and hiding
       a sidebar is the control's business to signal, not the mark's, so
       nothing here morphs.

       MEASURED at 1x, voicememos-window.png, the sidebar toggle standing in
       that window's toolbar band (the capsule x 96-135, the symbol x 106-125,
       y 18-33, in a control 36 px tall — the 24-unit mark box, so one px there
       is one unit here). Read against the control's own fill of 39 and a
       foreground of 233:

         the pane      19.31 by 15.12 units
         the band       1.39 units, all four sides — the leading side reads
                        233 then 115, which is 1.00 + 0.39 of a pixel, and the
                        trailing side 54, 233, 100, which is 0.08 + 1.00 + 0.31
         the seam       1.33 units, standing 4.99 units in from the inner pane
                        with 10.21 after it: one to 2.05
         the corners    a radius near 3 units — column 106 arrives at 0.05,
                        0.60, 0.92 and 1.00 down the four rows below the pane's
                        top edge, which a circle of r 3 gives as 0, 0.67, 0.98
                        and 1.00 and one of r 2 as 0, 0.96, 1.00, 1.00

       That 1.39 is one of the three readings the set's one band of 1.4 units
       is drawn to; this mark's own capture and the set's band agree to a
       hundredth.

       Grid: the pane is 19 by 15 on the 24 grid, so its sides sit on the
       set's square keyline 2.5 units in and its top and bottom at 4.5 and
       19.5 — the measured 19.31 drawn at the keyline and the measured 15.12
       at the nearest whole unit. Every edge here runs along the grid. That
       gives an inner pane of 16.2 by 12.2. Corner radius 3 outside and 1.6
       inside, which keeps the band even all the way round; a sharper corner
       reads as a screen rather than a window. Outer contour clockwise, inner
       counter-clockwise, so the band is a hole under the non-zero winding
       rule.

       The seam stands at 8.75, which is the measured one to 2.05 drawn on the
       quarter unit: 4.99 against 10.21 over an inner pane of 16.2 puts its
       leading edge at 8.75 to the hundredth, leaving a leading column of 4.85
       against a trailing one of 9.95. Its own contour, so it abuts the frame
       rather than winding against it.

       Where each band lands. A band of 1.4 units holds a whole device pixel
       when its own span contains one: at 24 dp that wants a leading edge on a
       whole unit or no more than 0.4 below one, at 20 dp a leading edge whose
       five sixths does the same against 1.167 px, and at 16 dp nothing at all
       — 1.4 units is 0.93 px there, under one device pixel. So the SEAM at
       8.75 lands a whole pixel at 24 dp and reaches 0.708 of its best pixel
       at 20 and 0.767 at 16. The pane's TOP at 4.5 and its FOOT at 18.1 land
       none, reaching 0.900 at 24 dp, 0.917 at 20 and 0.933 at 16. The two
       SIDES land none either, and cannot: the keyline's 19 units is odd
       against a 24-unit box, so they stand at 2.5 and 20.1 and reach 0.900 at
       24 dp, 0.917 at 20 and 0.600 at 16. The measurement stands over the
       crispness in every case, which is the trade the keyline's own reading
       and the set's one measured band each already made.
 -->
  <path fill="#000000" d="M18.5 4.5 C20.157 4.5 21.5 5.843 21.5 7.5 L21.5 16.5 C21.5 18.157 20.157 19.5 18.5 19.5 L5.5 19.5 C3.843 19.5 2.5 18.157 2.5 16.5 L2.5 7.5 C2.5 5.843 3.843 4.5 5.5 4.5 Z M5.5 5.9 C4.6163 5.9 3.9 6.6163 3.9 7.5 L3.9 16.5 C3.9 17.3837 4.6163 18.1 5.5 18.1 L18.5 18.1 C19.3837 18.1 20.1 17.3837 20.1 16.5 L20.1 7.5 C20.1 6.6163 19.3837 5.9 18.5 5.9 Z"/>
  <!-- The seam, one band wide, spanning the inner pane from top to
       bottom. -->
  <path fill="#000000" d="M8.75 5.9 L10.15 5.9 L10.15 18.1 L8.75 18.1 Z"/>
  <!-- The list lines: three bars at the set's SECOND band, standing high
       in the leading column the way a list that has not filled its pane does.
       They say "a list lives here"; they are not the subject, and what sets
       them apart is the weight the platform draws them at and not a fade
       laid over the figure's own.

       MEASURED off the same toggle, x 108-111, y 21-31: the three bars carry
       2.80 units of coverage between them over a length of 2.53, so each is
       0.93 units thick, and their centres stand 3.95, 6.15 and 8.35 units
       below the pane's top edge — a period of 2.20 — ending 3.78 units in
       from the inner pane. All four readings are drawn as measured: the bars
       run x 5.15 to 7.68 and their centres fall at 8.45, 10.65 and 12.85
       against a pane top of 4.5.

       The ends are cut square. A cap on a band 0.93 units thick has a radius
       of 0.465, which is 0.31 px at 16 dp and 0.47 at 24 — under half a device
       pixel at every size the library draws, so the shape of the end is not
       drawable and the geometry says so rather than carrying a curve nothing
       renders.

       Where each band lands. NONE of them, at any size, and that is the
       second weight rather than a miss: 0.93 units is 0.62 px at 16 dp, 0.78
       at 20 and 0.93 at 24, so no bar can hold a whole device pixel and each
       is drawn at part coverage of the control's own colour. What each
       reaches at 24 dp is 0.915, 0.815 and 0.615 of its best pixel, the three
       leading edges standing at 7.985, 10.185 and 12.385 on a period the
       device grid does not divide. -->
  <path fill="#000000" d="M5.15 7.985 L7.68 7.985 L7.68 8.915 L5.15 8.915 Z M5.15 10.185 L7.68 10.185 L7.68 11.115 L5.15 11.115 Z M5.15 12.385 L7.68 12.385 L7.68 13.315 L5.15 13.315 Z"/>
</svg>
