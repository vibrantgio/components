<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- History forward: the mark on the control that goes back to what the
       reader had stepped away from. A chevron pointing on, and the mirror of
       its back sibling, so a pair of them reads as one control.

       MEASURED at 1x, finder-window-light.png, the back/forward pair at the
       leading end of that window's content column (the control x 326-398, the
       back chevron x 340-347 and the forward one x 376-383, both y 19-32):
       the platform's toolbar chevron covers 8 px across by 14 down in a
       control 36 px tall — the 24-unit mark box, so one px there is one unit
       here — and its band measures 1.53 px perpendicular: row y=30 covers
       0.60 + 1.00 + 0.71 = 2.33 columns against a 254 fill and a 191
       foreground, and 2.33 x sin 41.2 = 1.53. Both chevrons are drawn in
       disabledControlText, Finder standing at the top of its history, which
       fixes the geometry and not the colour.

       THIS MARK'S OWN BAND IS THE EXCEPTION THE SET RECORDS: its capture
       reads 1.53 px perpendicular where the set draws one measured band of
       1.4 everywhere. The set draws the one band — 1.4 is what the compose
       symbol, the sidebar rectangle and the folder agree on, and a chevron
       drawn a tenth heavier than the marks beside it is the weight defect
       this set carried before. The reading is recorded and the one band
       stands.

       Grid: the drawing is the capture's 8 by 14, which takes neither the
       square keyline nor the round form's 13 units — a chevron standing in a
       band is not a form filling the mark box, and the platform draws it a
       third of the box's width. It stands at x 8 to 16 and y 5 to 19, centred
       on both axes. The band's centre line runs from 8.7,5.7 to 15.3,12 to 8.7,18.3: two arms 6.6 across
       by 6.3 down, at atan(6.3/6.6) = 43.7 degrees off the horizontal, which
       is the capture's OWN centre line — its covered 8 by 14 less a band of
       1.53 on each axis is 6.47 by 12.47, an arm of 6.47 by 6.235 at 43.9
       degrees. Round caps of 0.7 at both ends and a round turn carry the
       drawn figure to the measured 8 by 14 — the covered box is the centre
       line's own box grown the half-band on every side.

       Nothing here is axis-aligned, so the caps and the turn are drawn as
       geometry — the outline is one closed contour, which is what gives a
       stroked figure ends and a corner the backend would otherwise cut
       square.

       Where the band-landing rule reaches. It does not: both arms run on a
       diagonal and no edge of this drawing runs along the grid, so neither
       has a leading edge on a whole unit to land a whole device pixel inside.
       A band at 45 degrees covers 1.000 of the pixel it runs through at 24 dp
       and at 20, and 0.996 at 16 — the set's band is a DEVICE width, 1.32 px
       below 20 dp and 1.40 from 20 up — and these arms stand
       within a degree and a half of that; the mark is drawn at 24 dp wherever
       the library draws it, where one unit is one device pixel and the
       measured extent comes out exact. -->
  <path fill="#000000" d="M9.1833 5.1937 L16.3138 12 L9.1833 18.8063 C8.9037 19.0733 8.4606 19.063 8.1937 18.7833 C7.9267 18.5037 7.937 18.0606 8.2167 17.7937 L14.2862 12 L8.2167 6.2063 C7.937 5.9394 7.9267 5.4963 8.1937 5.2167 C8.4606 4.937 8.9037 4.9267 9.1833 5.1937 Z"/>
</svg>
