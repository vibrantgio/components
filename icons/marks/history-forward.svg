<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- History forward: the mark on the control that goes back to what the
       reader had stepped away from. A chevron pointing on, and the mirror of
       its back sibling, so a pair of them reads as one control.

       Grid: a diagonal form, so it takes the 20-unit allowance rather than the
       square keyline — a chevron inside an 18 box reads smaller than a square
       does. The band's centre line runs from 7.5,3 to 16.5,12 to 7.5,21: two
       arms at 45 degrees, every corner of the centre line on the 1.5 sub-grid,
       and the drawing 10.5 by 19.5 once the round caps and the round turn at
       the point are added. Nothing here is axis-aligned, so the caps and the
       turn are drawn as geometry — the outline is one closed contour, which
       is what gives a stroked figure ends and a corner the backend would
       otherwise cut square. -->
  <path fill="#000000" d="M8.03 2.47 L17.03 11.47 C17.323 11.763 17.323 12.237 17.03 12.53 L8.03 21.53 C7.737 21.823 7.263 21.823 6.97 21.53 C6.677 21.237 6.677 20.763 6.97 20.47 L15.439 12 L6.97 3.53 C6.677 3.237 6.677 2.763 6.97 2.47 C7.263 2.177 7.737 2.177 8.03 2.47 Z"/>
</svg>
