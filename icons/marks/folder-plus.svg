<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Folder-plus: a closed folder with a plus badge on the trailing corner
       of its body. It is the platform's own picture for the control that
       makes a folder; a mark is named by what it depicts, so what is created
       is the control's title to say, not the mark's.

       MEASURED at 1x off voicememos-multi-folder-2026-09-18.png, the
       new-folder control of a Voice Memos toolbar, the mark at x 209-230,
       y 57-72, on the window's #f9f9f9 fill against the figure's own #4b4b4b
       plateau. Sub-pixel edges are the coverage summed along a cut:

         the folder   18.44 px across by 14.82 down, every band 1.12 to 1.13,
                      the leading outer edge at x 209.00 and the trailing one
                      at 227.44, the body's top band at y 58.68 to 59.81
         the tab      open: under it the figure covers the tab's own band
                      alone, y 57.18 to 58.30, and the interior reaches that
                      inner face. The body's top band stands below it and
                      does not run under it
         the shoulder the tab's trailing edge descends to the body's top
                      rather than turning: its outer edge leaves the tab's
                      top at x 214.35 and reaches the body's top at 216.62,
                      a run of 2.27 px down 1.50, fitted against a straight
                      edge whose column average is what a coverage sum reads
                      to a root-mean-square of 0.038 of a pixel. On this
                      figure that is 2.34 units, from the top edge's end at
                      6.01 to the body's top at 8.35
         the badge    a filled disc 8.11 px across, centred (226.81, 60.98)
         the plus     knocked out of that disc, its arms 0.93 px across and
                      4.9 to 5.0 px tip to tip, centred on the disc's own
                      centre to a twentieth of a pixel on both axes
         the break    the folder's outline stops short of the disc, read on
                      each band's own centre line and from the disc's centre:
                      5.02 px where the trailing side resumes, 5.09 where the
                      flap ends, 5.17 where the body's top band ends
         the corners  the figure's foot leading corner is rounded at 2.30 px,
                      fitted against a band of the measured width whose outer
                      edge is rounded and whose inner edge is concentric with
                      it, the radius swept from 0 to 4 px in fortieths over a
                      6 by 6 px box about the corner, to a root-mean-square
                      of 0.008 of a pixel's coverage

       Grid: the set's own folder, moved 2 units leading so the badge fits
       the box. The folder is folder.svg's figure at 0.5 to 19.5 across and
       the disc carries the figure to 22.8: 22.3 units against the capture's
       21.87, because the set draws its folder to the 19-unit keyline and the
       capture's is 18.44 px across.

       THE TAB IS OPEN, as folder.svg's is and as this capture reads it: one
       band of the set's 1.4 from the tab's top edge at 4.5 to an inner face
       at 5.9, the body's top edge at 6, and the interior running from the
       body into the tab up to that face. THE TAB'S SHOULDER SLOPES to the
       body's top, as folder.svg's does and as this capture reads it: the
       outer edge runs from (6, 4.5) to (8.5, 6), which is folder.svg's own 8
       and 10.5 moved 2 units leading, and the interior follows 1.4 inside
       the slope rather than 1.4 below it, so the inner contour's two mitres
       stand at (8.1122, 7.4) and (5.6122, 5.9). This capture reads the run
       at 2.34 units where the plain folder beside it gives 2.49, and that
       folder is the same figure drawn at the set's own 19-unit keyline, so
       its reading is the one the set draws to.

       THE FIGURE STANDS OFF-CENTRE ACROSS, from 0.5 to 22.8 in a box of 24,
       half a unit of air at the leading edge and 1.2 at the trailing. That is
       the measured placement rather than a miss: the badge's centre is the
       capture's own 18.8 and the folder is folder.svg's figure, so the two
       readings together stand the figure where it stands, and centring it
       would carry one of them off its own. Down, the figure is folder.svg's
       own, 4.5 to 19.5, centred as that one is.

       THE BADGE IS CENTRED AT (18.8, 8.5). Across, that is the capture's own
       reading of 226.81 placed on this grid: the trailing band's own centre
       line at 226.88 rather than its outer edge at 227.44, which is 18.8
       units here. Down, it is 2.5 units below the body's top, the capture's
       own 2.30 px.

       THE DISC IS 8 UNITS across against the capture's 8.11 px. The library
       draws this mark at 24 dp, where one grid unit is one device pixel, so
       the whole unit nearest the reading comes out at the platform's own
       size — the step xmark-circle.svg takes for its own disc. The set's round and
       curved allowance of 13 is what a round form STANDING ALONE takes, and
       this disc stands on a folder.

       THE PLUS TAKES THE SET'S BAND AND THE CAPTURE'S IS THINNER: 0.93 px
       against the figure's own 1.12, which is 0.83 of a band, where the set
       draws one band of 1.4 everywhere. Its span is the capture's: 5 units
       against 4.9 to 5.0 px.

       THE PLUS'S UPRIGHT IS SNAPPED TO A WHOLE DEVICE PIXEL and the rest of
       the badge takes the geometry as it stands. The mark covers 24 and 48
       px at 1x and 2x and the badge takes no widening at either, so every
       edge of it stands where the grid puts it. A band of 1.4 holds a whole
       device pixel only from a leading edge on a whole unit or no more than
       four tenths below the next, and an upright centred on 18.8 would run
       18.1 to 19.5, a tenth past a whole unit and short of both. It is drawn
       at 18 to 19.4 instead, its leading edge on the whole unit 18, which
       holds one device pixel at 24 px and two at 48; what moves is where the
       bar sits inside the figure, by a tenth of a unit. The CROSSBAR keeps
       folder.svg's rule and runs 7.6 to 9, its trailing edge on the whole
       unit 9. The SPAN is the measured 5 units centred on the badge, so the
       two arm ends across stand at 16.3 and 21.3 — three tenths of a unit
       past the whole unit below each, which at 24 dp is three tenths of a
       device pixel off the nearest pixel boundary — and they land none at
       any size. That is what the measured span costs against a centre read
       at 18.8, and the span is what is kept. The two ends down stand on the
       whole units 6 and 11. The disc's edge is a curve and takes no such
       snapping, as xmark-circle.svg's does not.

       THE OUTLINE IS CUT ROUND THE BADGE, not painted over it. A painter is
       handed one colour and the mark is drawn in it, so a mark cannot paint
       the fill it stands on — it does not know it. The cut is a round of 5.4
       about the badge's centre: the disc's 4 and the set's own band. The
       capture gives 5.02 to 5.17 px at the three places its outline meets
       the cut, which against this figure's own 0.97 px to the unit is 5.17
       to 5.33 units, so the drawn round stands a tenth of a unit outside the
       widest of the three. The cut meets the body's top edge at x 14.0136,
       its inner top face at 13.5132, the flap at 13.4009 and 13.6125, and
       the trailing side at y 13.8544 on both of that band's edges, the arc
       dipping to 13.9 between them.

       THE CUT GROWS WITH THE WIDENING AND LEAVES A WHOLE DEVICE PIXEL CLEAR
       AT EVERY SIZE. The air between the cut and the disc is one band on the
       grid — the cut's 5.4 less the disc's 4 — and the capture reads it at
       0.97 to 1.12 px, one device pixel at the size that figure stands at.
       The folder's own bands are drawn at a device width below 24 dp, half of
       that widening spent outward on every edge the drawing lays down, and
       the cut is one of those edges: left to it the cut moves INWARD, and the
       air would come to 1.05 px at 20 dp and 0.74 at 16 — under the device
       pixel it takes for two figures to read as two. So the cut is grown
       ahead of the widening instead, by half of it and by whatever more
       leaves a whole device pixel clear: 5.54 units at 20 dp and 5.79 at 16
       against the 5.4 drawn here, the last of which is the OUTLINE yielding a
       further 0.07 px of its own where the grid's band of air comes to 0.93.
       The badge yields nothing — its disc is the measured 8 units and its
       plus the measured span knocked out of that disc — and below 24 dp every
       band the cut meets ends sooner than the numbers above, which are this
       drawing's own.

       THE GROWN CUT IS NOT DRAWN HERE and cannot be: it is a device width,
       as the band itself is, and one drawing serves every size. The
       renderer's widening step computes it from the device pixel, holding
       what this path draws clear of what the badge's path draws by the air
       the grid gives between them and never by less than one device pixel.

       THE OUTER CORNERS ARE ROUNDED AT 2.4 UNITS, which is folder.svg's own
       round: this capture gives 2.30 px at the one corner it reads cleanly,
       which against the folder's 18.44 px drawn at 19 units is 2.37, and the
       plain folder beside it in the same capture gives 2.33 to 2.52 units
       over its four. The three corners the badge leaves standing carry it —
       the tab's top leading, the foot leading and the foot trailing — and
       the body's top trailing corner is cut away by the badge. WHERE THE
       TAB MEETS THE BODY there is no corner to round, as in folder.svg: the
       shoulder slopes from the one to the other.

       Where each band lands. The six bands are folder.svg's, and moving them
       2 units leading moves what the two SIDES land. They now stand at 0.5
       and 18.1 rather than 2.5 and 20.1: the leading side holds a whole
       device pixel at none of the three sizes, reaching 0.900 of its best
       pixel at 24 dp, 0.700 at 20 and 0.860 at 16; the trailing side holds
       one at 20 and at 16 and reaches 0.900 at 24. The four bands that run
       ACROSS keep folder.svg's own landings, because a move along the grid's
       x axis cannot change where a band running that way falls: the body's
       TOP at 6 lands a whole pixel at all three sizes, the FLAP at 8.6 lands
       one at 24 dp and reaches 0.950 at 20 and 0.860 at 16, and the tab's
       top at 4.5 and the body's FOOT at 18.1 land one at 16 and at 20 and
       reach 0.900 at 24.

       THE BADGE IS NO BAND AND TAKES NO WIDENING. Its disc is a measured
       extent and its plus a measured span knocked out of that disc, so the
       path is drawn as the grid gives it at every size and the plus's arm
       comes out 1.40 px at 24 dp, 1.17 at 20 and 0.93 at 16. The folder's
       own bands do take the widening, and the cut is grown ahead of it, so
       the air between the outline and the disc comes out 1.40 px at 24 dp,
       1.17 at 20 and 1.00 at 16: the band of air the grid draws between the
       two, and never under a device pixel.

       Three paths. The SILHOUETTE is one contour: the tab's bar and the
       body, because the round at the top leading corner runs from the tab's
       top edge into the leading side, and because the badge's cut reaches
       from outside the box into the space the outline encloses and leaves a
       single open strip, closed here through its arcs. A round wound against
       the box instead would leave that enclosed space at a winding of -1 and
       fill it solid, which is the trap xmark-circle.svg's single cross contour
       avoids. Its inner edge rises along the shoulder from 8.1122 on the
       body's inner top face to 5.6122 on the tab's inner face at 5.9. The FLAP is its own contour, cut by the same round. The BADGE
       is the disc wound clockwise with the plus wound against it inside one
       path, so the fill the mark stands on shows through the plus and
       nothing is painted in the surface's colour; the plus is ONE contour
       around the union of its two bars, because two each wound against the
       disc would leave the crossing at -1 and fill it solid. -->
