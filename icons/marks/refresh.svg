<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Refresh: the control that reads again what the window is showing, from
       wherever it came from. One picture whatever is being read again; what
       that is belongs to the control's label.

       No stored capture holds this control: none of the five toolbar bands in
       reference/macos/controls.md carries one, so the drawing's proportions
       are the set's grid and nothing else, stated here as the plus and the
       search marks state their measured readings. The capture is on the
       reference's list. What this mark does take from the measurement is the
       set's two settled numbers: the one band of 1.4 units and the round and
       curved allowance of 13, read off the magnifier's lens in
       finder-window-light.png against the tag's 19 px square in the same
       band.

       Grid: a curved form, so its ring takes the 13-unit allowance rather
       than the square keyline. The ring is centred on 12,12.7 with an outer
       radius of 6.5 and an inner one of 5.1 — the set's one band of 1.4,
       curved everywhere and running along an axis at four points only — so
       its outer edge reaches 5.5 and 18.5 across and 6.2 and 19.2 down. The
       arrowhead's base carries the drawing to 4.8 at the top, which puts the
       figure at 13 by 14.4, centred on both axes. The ring's centre sits
       0.7 below the grid's, which is half of what the head reaches past the
       ring at the top, so the figure comes out centred.

       The ring is open at the top trailing, from the head at the top round to
       20 degrees short of the trailing middle: 70 degrees of gap and 290 of
       band. The arrowhead caps the band's end at the top, its base the band's
       own end face carried out to 2.1 units either side — one and a half
       bands, as the figure carried before the band was measured — and its tip
       3.5 units along the tangent, so the figure turns clockwise, the
       direction the platform's own reload marks turn. Two contours: the ring
       is one closed outline with its inner edge wound back against its outer,
       and the head abuts its end face rather than winding against it.

       Where the band-landing rule reaches. It does not: the ring is curved
       everywhere and runs along an axis at four points only, as the search
       mark's lens does, so it has no leading edge on a whole unit to land a
       whole device pixel inside. A band of 1.4 units is 0.93 px at 16 dp,
       1.17 at 20 and 1.40 at 24; the head is a solid triangle and is the one
       place this figure arrives at the control's own colour undiluted at
       every size. -->
  <path fill="#000000" d="M18.108 10.4769 C19.0783 13.1427 18.2076 16.1298 15.9569 17.8568 C13.7063 19.5838 10.5956 19.6517 8.2718 18.0245 C5.9479 16.3973 4.9478 13.451 5.8008 10.7454 C6.6539 8.0398 9.1631 6.2 12 6.2 L12 7.6 C9.7741 7.6 7.8054 9.0436 7.136 11.1664 C6.4667 13.2892 7.2514 15.601 9.0748 16.8777 C10.8981 18.1544 13.3388 18.1011 15.1047 16.7461 C16.8706 15.3911 17.5537 13.0473 16.7924 10.9557 Z"/>
  <path fill="#000000" d="M12 4.8 L15.5 6.9 L12 9 Z"/>
</svg>
