<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Check: the mark that says this is the one. It stands beside the row a
       control is currently holding — a menu's current item — and beside
       nothing else; a control that is merely under the pointer is told by its
       fill, not by this.

       Grid: a diagonal form, so it takes the diagonal allowance of 20 units
       rather than the square keyline or the round form's 13, as the clear
       mark does. The band's centre line runs from 4.5,12.5 to 9,17 to
       19.5,6.5: two arms at 45 degrees, the short arm down and out and the
       long arm up and out. The band is the set's one measured width of 1.4
       units, spent perpendicular to the arm, and with its round caps and its
       turn the drawing spans 16.4 by 12.19 units, inside the allowance on
       both axes.

       WHERE the two arms stand decides what they reach. A 45-degree band
       covers a whole device pixel only where the pixel's own centre lies on
       its centre line, and a pixel's centre stands at a half in both axes, so
       an arm running x+y = c or x-y = c reaches a whole pixel when c is a
       whole unit and 0.87 of one when c falls on a half. The short arm runs
       x-y = -8 and the long arm x+y = 26, both whole, which is what puts this
       mark at the control's own colour at 24 dp; the drawing sits half a unit
       lower in the box than the centre line's own bounds would, and that half
       unit is the whole reason.

       NOT MEASURED. No stored capture in reference/macos holds a checkmark
       at all — not in a menu, not in a list — so this figure is drawn to the
       set's grid rather than read off the platform, and the capture that
       would settle its proportion is on the reference's list. What it does
       take from the measurement is the band: the set draws one width and this
       mark draws it like the rest.

       The DIAGONAL allowance is not measured the way the square keyline and
       the round form's 13 units are, and the set records the miss: it stays
       20 units, and no stored capture holds a bare diagonal band standing
       alone in a toolbar band at all. Notes' compose covers 17 by 17, the
       nearest reading, and it is a figure rather than a bare band. The
       capture that would settle it is on the reference's list.

       Where the band-landing rule reaches. It does not: both arms run at 45
       degrees and no edge of this drawing runs along the grid, so neither has
       a leading edge on a whole unit to land a whole device pixel inside. A
       45-degree band of 1.4 units covers 1.000 of the pixel it runs through
       at 24 dp, 0.969 at 20 and 0.884 at 16 — which is the set's one band on
       the axis to within a few hundredths at every size, and why this set no
       longer draws its diagonals heavier than its straight edges.

       The caps and the turn are drawn as geometry: nothing here is
       axis-aligned, and this set's SVG backend can ask for neither a line cap
       nor a join, so the outline is one closed contour — the centre line
       offset 0.7 to each side, mitred at the turn and capped round at both
       ends. -->
  <path fill="#000000" d="M4.995 12.005 L9 16.0101 L19.005 6.005 C19.2784 5.7317 19.7216 5.7317 19.995 6.005 C20.2683 6.2784 20.2683 6.7216 19.995 6.995 L9 17.9899 L4.005 12.995 C3.7317 12.7216 3.7317 12.2784 4.005 12.005 C4.2784 11.7317 4.7216 11.7317 4.995 12.005 Z"/>
</svg>
