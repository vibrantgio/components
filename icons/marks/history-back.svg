<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- History back: the mark on the control that returns to what was shown
       before. A chevron pointing at where the reader came from, and the mirror
       of its forward sibling, so a pair of them reads as one control.

       Grid: a diagonal form, so it takes the 20-unit allowance rather than the
       square keyline — a chevron inside an 18 box reads smaller than a square
       does. The band's centre line runs from 16.5,3 to 7.5,12 to 16.5,21: two
       arms at 45 degrees, every corner of the centre line on the 1.5 sub-grid,
       and the drawing 10.5 by 19.5 once the round caps and the round turn at
       the point are added. Nothing here is axis-aligned, so the caps and the
       turn are drawn as geometry — the outline is one closed contour, which
       is what gives a stroked figure ends and a corner the backend would
       otherwise cut square. -->
  <path fill="#000000" d="M15.97 2.47 L6.97 11.47 C6.677 11.763 6.677 12.237 6.97 12.53 L15.97 21.53 C16.263 21.823 16.737 21.823 17.03 21.53 C17.323 21.237 17.323 20.763 17.03 20.47 L8.561 12 L17.03 3.53 C17.323 3.237 17.323 2.763 17.03 2.47 C16.737 2.177 16.263 2.177 15.97 2.47 Z"/>
</svg>
