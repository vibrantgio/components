<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Plus: the control that adds one more of what the window holds — a new
       note, a new chat, a new recording. One picture in every state; what is
       about to be added is the control's label to say.

       Grid: an axis-aligned form, so it fills the set's square keyline — each
       arm runs from unit 2.5 to unit 21.5, a 19 by 19 box — and takes the
       set's one band of 1.4 units.

       MEASURED at 1x, the compose symbol of a toolbar control in
       notes-toolbar.png (the control at x 8-44) and mail-window.png
       (x 404-441): the symbol's covered box is 17 and 16 px in a control 36 px
       tall, and its band measures 1.40 px on both — a run across the square's
       leading edge reads 233 then 115 on a fill of 35 and of 36, which over a
       foreground of 233 is 1.00 + 0.40 of a pixel, and its trailing edge 208
       then 140, which is 0.87 + 0.53.

       That 1.40 is the reading the whole set's band is drawn to, and this is
       the mark it was read off. The compose symbol is also the platform's own
       new-item control and the SMALLEST square reading in the reference; the
       set's keyline is the LARGEST — Finder's tag at 19 by 19 — and one
       keyline draws the whole set, so this mark is drawn two to three units
       wider than the symbol it is read against. Both readings are recorded
       and the keyline stands.

       Where each band lands. The two bars — the crossbar and the upright —
       run from unit 10.6 to unit 12 rather than sitting centred on unit 12,
       and that is what puts a whole device pixel inside them at 20 and 24 dp:
       the band's trailing edge stands on 12, a whole unit and a multiple of
       6, which is what a band of 1.4 needs to hold a pixel whole at both
       sizes. So the crossing covers one pixel whole and its neighbours in
       part — the capture's own profile, one pixel at the mark's colour and a
       fraction beside it. A band centred on unit 12 splits evenly across two
       pixels and reaches the colour on neither, which reads grey beside a
       label drawn in the same colour. The drawn extent stays centred: what
       moves is where the two bars sit inside it, by seven tenths of a unit.

       The ARM ENDS stand on the keyline at 2.5 and 21.5, which the keyline's
       odd 19 units keeps off every whole unit, so each arm's last pixel lands
       a whole device pixel at 20 dp — where the widening carries its leading
       edge down onto 1.967 — and none at 24 or 16, reaching 0.900 and 0.793
       of its best pixel there. That is the price the keyline's measured units
       carries through the whole set. The two BARS land a whole pixel at every
       one of the three sizes: the band is a device width, 1.32 px below 20 dp
       and 1.40 from 20 up, and their leading edge at 10.6 leaves room for one
       at all three.

       The ends are cut square: a cross is read by its crossing, and a cap on
       four arms only thickens the figure — the same rule the clear mark's two
       bands are drawn by. Two contours, one per arm, abutting rather than
       winding against each other. -->
  <path fill="#000000" d="M2.5 10.6 L21.5 10.6 L21.5 12 L2.5 12 Z"/>
  <path fill="#000000" d="M10.6 2.5 L12 2.5 L12 21.5 L10.6 21.5 Z"/>
</svg>
