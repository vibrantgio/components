<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Document: the thing a sidebar row stands for when the entry is a single
       piece of content — a note, a file, a page. It names a thing and not a
       control, as the folder mark does.

       MEASURED at 1x, the page symbol on Finder's "Documents" row in
       finder-window-untinted-dark.png (the panel at x 64, the row's mark over
       x 87-99, y 256-274). Sub-pixel edges are a fit of the coverage, each
       stroke fitted over the rows or columns that stand clear of the rounds
       and the fold against a band of one width at one place:

         across      the leading side's outer edge at x 86.000 on a band of
                     1.390 and the trailing side's inner edge at 98.478 on one
                     of 1.400, to a root-mean-square of 0.003 and 0.001 of a
                     pixel's coverage over seven rows. THE PAGE IS 13.88 PX
                     ACROSS, from 86.000 to 99.878
         down        the top at y 256.380 and the foot's outer edge at
                     275.000, 18.62 down, on bands of 1.47 to 1.55
         the fold    its upright's leading edge at x 92.293 on a band of
                     1.240, 6.29 px into the page; its crossbar's top edge at
                     y 263.135 on a band of 1.315, 6.76 px below the top

       THE TOP AND THE FOOT READ HEAVIER THAN THE SIDES, and the set's one
       stroke is drawn on all four and covers the reading. MEASURED on the
       same capture, the coverage summed down each column standing clear of
       the rounds and the fold: the foot reads 1.47 px over the nine such
       columns and the top the same 1.47 over the three it has, where the
       leading side reads 1.390 and the trailing 1.400 over the rows standing
       clear of the rounds. The 0.08 px between the two pairs is below what
       one capture at 1x can state: what a coverage sum reads off an encoded
       capture moves with where a stroke's edges fall on the pixel grid, and
       the set's other stored capture of a stroke this thin — the folder on
       voicememos-multi-folder-2026-09-18.png — reads its two sides at
       1.50 px against 1.49 across, the other way about. So nothing here is
       redrawn.

       The page's top-trailing corner is cut on a diagonal from
       (94,257) to (100,263) — six columns against seven rows, so a
       45-degree cut. The fold is closed from inside by those two lines: the
       upright runs from under the top edge down to the cut's end, and the
       crossbar from there out to the trailing edge.

       THIS MARK'S OWN EXTENT IS THE EXCEPTION THE SET RECORDS: its capture
       reads the page 13.88 PX ACROSS where the set's square keyline is 19,
       so the figure takes the keyline in its long direction only and its own
       fitted extent across it. Its band, on the other hand, is the set's own:
       the capture's 1.4 px is the reading the whole set is drawn to.

       Grid: an axis-aligned form with one diagonal, so it fills the set's
       square keyline in its long direction — 2.5 to 21.5 down, 19 units —
       and takes the set's one band of 1.4. ACROSS IT TAKES THE FITTED 13.88
       AT THE WHOLE UNIT NEAREST IT, 14, drawn from 5 to 19, which centres the
       figure on both axes and stands both sides on a whole unit: the library
       draws this mark at 24 dp, where one grid unit is one device pixel, so
       the whole unit nearest the reading comes out at the platform's own
       size. The corner is cut 6 by 6, the measured 45 degrees, which the two
       fitted extents put at 6.05 units across and 6.12 down.

       The cut runs at 45 degrees and is drawn at the set's one band like
       every other edge here: the capture reads the diagonal at the same
       1.4 px perpendicular as the four straight edges, and one measured band
       is what the whole set draws whichever way an edge runs.

       The fold's crossbar is drawn where the capture puts it: its top edge
       stands 6.76 px below a page 18.62 px down, which is 6.90 units into
       this one, and it is drawn at 9.5. The fold's UPRIGHT is drawn at the
       whole unit beside its own reading. The capture stands its leading edge
       6.29 px into a page 13.88 px across, which is 11.35 here, and 11 is
       drawn — because a band of 1.4 holds a whole device pixel only from an
       edge on a whole unit or just under one, and a figure whose every band
       misses reads grey at the small sizes against a label drawn in the same
       colour. 11 stands under the cut, and the fold closes at its own apex:
       the inner diagonal reaches x 12.4201 at the inner top face, two
       hundredths of a unit past the upright's trailing edge at 12.4.

       Where each band lands. The set's band is a DEVICE width — 1.32 px
       below 20 dp and 1.40 from 20 up — and half its widening is spent
       outward on either edge, so it covers a whole device pixel at all three
       sizes and what decides a landing is where its leading edge falls: no
       more than 0.40 px below a pixel boundary at 24 dp, 0.40 at 20 and 0.32
       at 16. So the fold's
       UPRIGHT at 11 lands a whole pixel at 24 dp and reaches 0.950 at 20 and
       0.860 at 16; the fold's CROSSBAR at 9.5 lands one at 20 dp and reaches
       0.900 at 24 and 0.860 at 16. The two SIDES at 5 and 17.6 land one at
       24 dp and reach 0.950 at 20 and 0.860 at 16. The page's TOP at
       2.5 and its FOOT at 20.1 stand on the keyline, which the keyline's 19
       odd units keeps off every whole unit: they land one at 20 dp alone,
       reaching 0.900 at 24 and 0.793 at 16. That is what a figure
       measured on both axes costs on this grid; the readings stand and the
       misses are recorded.

       THE THREE SQUARE CORNERS ARE ROUNDED AT 2.4 UNITS. MEASURED off the
       same capture: the pixel coverage of each corner's own square was
       fitted against a band of the measured width whose outer edge is
       rounded and whose inner edge is concentric with it, over a radius
       swept from 0 to 4 px in fortieths and read over a 6 by 6 px box about
       the corner. The page's top leading gives 2.450 px and its two foot
       corners 2.525 each, to a root-mean-square of 0.028 of a pixel's
       coverage. This page is drawn 14 units across against the fitted 13.88
       and 19 down against the fitted 18.62, so one measured pixel is 1.009
       of a unit on the one axis and 1.020 on the other, which puts the top
       leading corner's round at 2.47 units and 2.50 and each foot corner's
       at 2.55 and 2.58. 2.4 IS DRAWN, the round the folder's own capture
       gives at 2.33 to 2.52 units and the one the whole set is drawn to,
       which also puts the band's inner round on the whole unit 1. The four
       readings here run 2.47 to 2.58 units. The CUT'S two ends carry
       no round: they are not square corners, and the capture's diagonal
       meets the top edge and the trailing side as the figure draws it.

       Three contours. The page is one outline with its inner edge wound back,
       the inner edge offset 1.4 perpendicular everywhere — which puts the
       inner diagonal's corners at 12.4201,3.9 and 17.6,9.0799 and the inner
       rounds at 1.0, concentric with the outer ones. The fold's two
       lines are drawn in the same direction as the outer contour, so where
       one crosses the cut's own band the overlap fills solid under the
       non-zero winding rule rather than cutting a hole in it. -->
  <path fill="#000000" d="M7.4 2.5 L13 2.5 L19 8.5 L19 19.1 C19 20.4255 17.9255 21.5 16.6 21.5 L7.4 21.5 C6.0745 21.5 5 20.4255 5 19.1 L5 4.9 C5 3.5745 6.0745 2.5 7.4 2.5 Z M6.4 4.9 L6.4 19.1 C6.4 19.6523 6.8477 20.1 7.4 20.1 L16.6 20.1 C17.1523 20.1 17.6 19.6523 17.6 19.1 L17.6 9.0799 L12.4201 3.9 L7.4 3.9 C6.8477 3.9 6.4 4.3477 6.4 4.9 Z"/>
  <path fill="#000000" d="M11 3.9 L12.4 3.9 L12.4 9.5 L11 9.5 Z"/>
  <path fill="#000000" d="M11 9.5 L19 9.5 L19 10.9 L11 10.9 Z"/>
</svg>
